[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "billing-mock"
version = "0.1.0"
description = "Mock billing API backend for mcp-portal integration tests"
requires-python = ">=3.14.7"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "pyjwt[crypto]>=2.14,<3",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/billing_mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

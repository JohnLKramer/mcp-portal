[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-sidekit"
version = "0.1.0"
description = "An MCP sidecar for HTTP/gRPC services"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sidekit"]

version: "1"
mode: configured

server:
  name: integration-portal
  transport: stdio

upstreams:
  billing:
    base_url: http://localhost:8081
    timeout_ms: 5000
  orders:
    base_url: http://localhost:8082
    timeout_ms: 5000
    auth:
      outbound:
        mode: static
        header: X-Api-Key
        scheme: null
        value: ${env:ORDERS_MOCK_API_KEY}

naming:
  strategy: operation_id
  prefix_with_group_tag: true

operations:
  - id: list_invoices
    upstream: billing
    description: List invoices for a customer.
    group_tags: [billing]
    binding:
      method: GET
      path: /v1/invoices
      parameters:
        - { arg: customer_id, in: query, wire_name: customerId, required: true,
            schema: { type: string } }
        - { arg: limit, in: query, required: false, schema: { type: integer } }

  - id: get_customer_tax_id
    upstream: billing
    description: Get a customer's tax identifier.
    group_tags: [billing]
    binding:
      method: GET
      path: /v1/customers/{id}/tax-id
      parameters:
        - { arg: customer_id, in: path, wire_name: id, required: true,
            schema: { type: string } }

  - id: create_invoice
    upstream: billing
    description: Create an invoice.
    group_tags: [billing]
    binding:
      method: POST
      path: /v1/invoices
      body:
        content_type: application/json
        mode: flatten
        schema:
          type: object
          properties:
            customer_id: { type: string }
            amount_cents: { type: integer }
          required: [customer_id, amount_cents]

  - id: list_orders
    upstream: orders
    description: List orders.
    group_tags: [orders]
    binding:
      method: GET
      path: /v1/orders

  - id: get_order
    upstream: orders
    description: Get an order by id.
    group_tags: [orders]
    binding:
      method: GET
      path: /v1/orders/{id}
      parameters:
        - { arg: order_id, in: path, wire_name: id, required: true,
            schema: { type: string } }

  - id: create_order
    upstream: orders
    description: Create an order.
    group_tags: [orders]
    binding:
      method: POST
      path: /v1/orders
      body:
        content_type: application/json
        mode: flatten
        schema:
          type: object
          properties:
            customer_id: { type: string }
            item_count: { type: integer }
          required: [customer_id, item_count]

version: "1"
mode: configured

server:
  name: integration-portal-policy
  transport: stdio

upstreams:
  billing:
    base_url: http://localhost:8081
    timeout_ms: 5000

policy:
  file: ./policy.yaml

auth:
  local_principal:
    authorization_details:
      - type: customer_data

naming:
  strategy: operation_id
  prefix_with_group_tag: true

operations:
  - id: list_invoices
    upstream: billing
    description: List invoices for a customer.
    group_tags: [billing]
    binding:
      method: GET
      path: /v1/invoices
      parameters:
        - { arg: customer_id, in: query, wire_name: customerId, required: true,
            schema: { type: string } }

  - id: get_customer_tax_id
    upstream: billing
    description: Get a customer's tax identifier.
    group_tags: [billing]
    binding:
      method: GET
      path: /v1/customers/{id}/tax-id
      parameters:
        - { arg: customer_id, in: path, wire_name: id, required: true,
            schema: { type: string } }

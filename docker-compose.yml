services:
  # pinned: mcp-portal reaches the IdP at localhost:8083 (host-side), but
  # billing-mock verifies the service-name issuer it fetches JWKS from —
  # without this override, mock-oauth2-server would derive "iss" from the
  # Host header of whichever caller hit it last, and billing-mock's issuer
  # check would fail.
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8083:8080"
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "client_credentials",
                  "claims": {
                    "sub": "billing-service",
                    "aud": ["billing-mock"],
                    "iss": "http://mock-oauth2-server:8080/default"
                  }
                }
              ]
            }
          ]
        }

  billing-mock:
    image: billing-mock:local
    ports:
      - "8081:8080"
    environment:
      MOCK_OAUTH2_ISSUER: http://mock-oauth2-server:8080/default
    depends_on:
      - mock-oauth2-server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5

  orders-mock:
    image: orders-mock:local
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5

  graphql-mock:
    image: graphql-mock:local
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
